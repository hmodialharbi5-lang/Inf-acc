name: Build InfiniteAccessories

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Download TShock 6.1.0
        run: |
          wget -q \
            "https://github.com/Pryaxis/TShock/releases/download/v6.1.0/TShock-6.1.0-for-Terraria-1.4.5.6-linux-x64-Release.zip" \
            -O tshock.zip

      - name: Extract TShock
        run: |
          mkdir -p tshock
          unzip -q tshock.zip -d tshock

          echo "=== TShock files ==="
          find tshock -maxdepth 3 -type f | sort

      - name: Find TShock DLLs
        run: |
          mkdir -p References

          find tshock -type f -iname "TShockAPI.dll" \
            -exec cp -f {} References/TShockAPI.dll \; -quit

          find tshock -type f -iname "TerrariaApi.Server.dll" \
            -exec cp -f {} References/TerrariaApi.Server.dll \; -quit

          find tshock -type f -iname "TerrariaServer.dll" \
            -exec cp -f {} References/TerrariaServer.dll \; -quit

          echo "=== References found ==="
          ls -lah References

      - name: Verify references
        run: |
          echo "Checking TShockAPI..."
          test -f References/TShockAPI.dll

          echo "Checking TerrariaApi.Server..."
          test -f References/TerrariaApi.Server.dll

          echo "Checking TerrariaServer..."
          test -f References/TerrariaServer.dll

          echo "ALL REQUIRED REFERENCES FOUND!"

      - name: Restore
        run: dotnet restore InfiniteAccessories.csproj

      - name: Build
        run: |
          dotnet build InfiniteAccessories.csproj \
            --configuration Release \
            --no-restore

      - name: Show output
        run: |
          echo "=== BUILD OUTPUT ==="
          find bin/Release -type f -print

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteAccessories
          path: bin/Release/net9.0/InfiniteAccessories.dll
          if-no-files-found: error
