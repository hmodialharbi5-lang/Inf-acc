name: Build InfiniteAccessories

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore NuGet packages
        run: dotnet restore InfiniteAccessories.csproj

      - name: Build plugin
        run: dotnet build InfiniteAccessories.csproj \
          --configuration Release \
          --no-restore

      - name: Show build output
        run: |
          echo "=== Build output ==="
          find bin/Release -type f -print

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteAccessories
          path: bin/Release/net9.0/InfiniteAccessories.dll
          if-no-files-found: error
